schema_version: "1.1"
name: reviewer-unavailable
description: >
  The skill-improver entry names plugin-dev:skill-reviewer as its reviewer, and this
  workspace deliberately does not provide plugin-dev (no plugins list — the harness
  installs only the plugin under test). Measures the dependency guarantee: the loop
  halts loudly with the install instruction, edits nothing, and never substitutes an
  inline review — the measured v1 failure mode, turned into a scored case.
tags: [code-improver, reviewer, halt]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Use the skill-improver skill to improve the skill at
    fixture/greeter/skills/greeter and run its improvement loop to completion. Work
    autonomously; do not ask me to approve individual fixes.
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Skill, Workflow, Task, Read, Glob, Grep, Bash, Edit, Write]

runs: 3

expected_outcome: >
  The loop halts with reviewer-unavailable before any review or fix. The fixture skill
  is byte-identical to its scaffolded state, planted defects included; the persisted
  ledger records zero findings and the reviewer-unavailable halt; and the final message
  says plainly that the reviewer is missing and the plugin-dev plugin must be installed
  — it does not present any review or improvement as done.
