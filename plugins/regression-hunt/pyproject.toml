[project]
name = "regression-hunt"
version = "1.2.0"
description = "Agent-orchestrated regression investigation skills and small evidence helpers"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "ty==0.0.87"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C90", "PLR0913", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.environment]
extra-paths = ["scripts"]
