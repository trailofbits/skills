name: triage
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.repository }}
    steps:
      - uses: anthropics/claude-code-action@a1b2c3d
        with:
          prompt: |
            Summarise the open issues in REPO_NAME and post a weekly digest.
