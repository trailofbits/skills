name: triage
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@a1b2c3d
        with:
          prompt: |
            Review this report and reply.
            Body: ${{ github.event.issue.body }}
