schema_version: "1.1"
name: decompiled-continuity
description: >
  Continuity where the callee has no body at all. local_len is written only by FUN_80103f80, an unresolved
  external, and is then used as the copy length into a 512-byte .bss buffer. The visible listing contains a
  decoy check (param_2 < 8) that bounds the header rather than the payload. The correct answer is that the
  bound is established by nothing recoverable, which is a complete finding rather than a failure to finish.
tags: [continuity, decompiled, firmware]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Read decomp.c in the fixture directory. It is Ghidra output from a MIPS firmware image.

    We're starting vulnerability research on this firmware. Build the context on FUN_80104a2c — what it does,
    what it depends on, and what it assumes — before anyone starts hunting.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Task]

runs: 3

expected_outcome: >
  The analysis reports that local_len is written only by FUN_80103f80, which has no body in the image, so the
  length passed to the copy into DAT_8042c000 is established by nothing in the visible listing, and does not
  infer behavior from the decoy param_2 < 8 check or from the memcpy-shaped signature of thunk_FUN_801001c0.
