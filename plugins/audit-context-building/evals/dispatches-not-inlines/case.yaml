schema_version: "1.1"
name: dispatches-not-inlines
description: >
  The plugin's central rule is that per-function analysis never happens in the invoking context — it goes to
  the workflow or to the function-analyzer agent, and only records come back. This case asks for audit
  context on a small C codebase with no tool available to dispatch with, so the only way to satisfy the rule
  is to say what to run rather than to start analyzing.
tags: [dispatch, output-discipline]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Build the audit context for the C code in the fixture directory — proto.c, proto.h, and frame.c.

    We're starting an audit next week and I want the groundwork laid now, so whoever picks it up can start
    from what you produce instead of re-reading the parser from scratch.
  # The skill reads three reference files before it starts, so it needs roughly twice the turns a bare
  # agent does on this prompt. At max_turns 20 the plugin arm was truncated before it answered, which
  # scored as a routing failure. This case is meant to measure whether it routes, not how fast.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The response routes the work to /audit-context-building:audit-context or to the function-analyzer agent,
  rather than producing per-function analysis inline in the reply.
