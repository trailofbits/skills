schema_version: "1.1"
name: contract-continuity
description: >
  The plugin's original purpose. Same continuity property as continuity-across-calls, in Solidity: release()
  reads as though require(_charge(...)) enforced that the buyer's credit covered the fee, and the whitelisted
  branch of _charge subtracts inside an unchecked block and returns true without comparing credit to amount.
  Also exercises the contract-specific black-box case — feeSink.notify() is an interface call with no
  implementation in scope, and its return value is the fee.
tags: [continuity, contracts]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Read Escrow.sol in the fixture directory.

    We're picking up an audit of this escrow contract. Build the context on release() — what it does, what it
    depends on, and what it assumes — before anyone starts looking for bugs.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Task]

runs: 3

expected_outcome: >
  The analysis reports that the whitelisted branch of _charge returns true without checking that credit
  covers the amount, so release()'s precondition is unestablished for whitelisted buyers, and treats
  feeSink.notify() as an untrusted external call whose return value is unbounded — both recorded as
  unenforced assumptions rather than as vulnerabilities with severities and fixes.
