schema_version: "1.1"
name: continuity-across-calls
description: >
  The bound that makes parse_record's memcpy safe lives two calls away, in decode_length, and only on one of
  its two branches. The extended-frame branch composes a length from the flags high nibble and returns
  success without ever comparing it to MAX_PAYLOAD. From the caller this is invisible: the return value is
  checked, the bound check exists and is visible one level down, and both proto.h and validate_header's
  contract promise the result is capped. Finding it requires reading two hops down and comparing both
  branches, which is the one behavior this skill exists to produce.
tags: [continuity, context-building]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Read proto.c and proto.h in the fixture directory.

    We're about to start an audit of this protocol parser and I want the context built first. Analyze
    parse_record: what it does, what it depends on, and what it assumes. I want to understand the function
    before anyone starts looking for bugs in it.
  max_turns: 30
  timeout_seconds: 900
  # Task is available because the skill dispatches rather than analyzing inline; this exercises the real
  # path (function-analyzer runs, its record comes back) instead of a path the plugin tells you not to take.
  allowed_tools: [Read, Glob, Grep, Skill, Task]

runs: 3

expected_outcome: >
  The analysis reports that the FLAG_EXTENDED branch of decode_length returns success with a length never
  checked against MAX_PAYLOAD, so parse_record's memcpy length is unbounded on that path, and records it as
  an unenforced assumption rather than as a vulnerability with a severity and a fix.
