[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ct-analyzer"
version = "0.1.0"
description = "Constant-time assembly analyzer for detecting timing side-channel vulnerabilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Scott Arciszewski", email = "opensource@trailofbits.com"}
]
keywords = [
    "cryptography",
    "security",
    "timing-attack",
    "side-channel",
    "constant-time",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ct-analyzer = "ct_analyzer.analyzer:main"

[project.urls]
Homepage = "https://github.com/trailofbits/skills"
Documentation = "https://github.com/trailofbits/skills/tree/main/plugins/constant-time-analysis#readme"
Repository = "https://github.com/trailofbits/skills.git"

[tool.ty.environment]
# The tests run as scripts and reach the modules via `sys.path.insert`, importing
# `analyzer` rather than `ct_analyzer.analyzer`. Without this, ty reports every one
# of those imports as unresolved, which buries the diagnostics that matter.
extra-paths = ["ct_analyzer"]

[tool.hatch.build.targets.wheel]
packages = ["ct_analyzer"]

[tool.hatch.build.targets.sdist]
# Every fixture the test suite reads, not just the three C/Go/Rust globs that
# were listed: a packaged install was missing the Python, Ruby, PHP, JS, TS,
# Java, C#, Kotlin and Swift samples, so the tests that use them could not run
# from an sdist. `triage_samples` also needs expectations.json, which is the
# manifest driving the triage matrix.
include = [
    "ct_analyzer/**/*.py",
    "ct_analyzer/tests/test_samples/*",
    "ct_analyzer/tests/triage_samples/*",
]
