# Deliberately no [tool.ruff] section. Ruff configures each file from the nearest
# ancestor config that has one, so adding it here would replace the repo's ruff.toml —
# and its select list — with these two lines, quietly linting this directory less than
# every other plugin. Both scripts run standalone under `uv run` with PEP 723 headers;
# this file exists for editors and type checkers.
[project]
name = "codeql-skill-scripts"
version = "0.1.0"
description = "Quality gate and suite verifier for the static-analysis codeql skill"
requires-python = ">=3.11"
dependencies = []
