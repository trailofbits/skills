[project]
name = "trailmark-context-slicer"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["trailmark>=0.7.1,<0.8"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["test_build_slice_packet.py"]
