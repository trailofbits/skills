rules:
  - id: python-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Command injection vulnerability. User input flows to a shell command
      without sanitization.
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - pattern: os.system(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
