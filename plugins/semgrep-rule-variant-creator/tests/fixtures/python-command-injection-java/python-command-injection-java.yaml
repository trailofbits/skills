rules:
  - id: python-command-injection-java
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Command injection vulnerability. User input from the HTTP request flows
      into a process launch without validation. Pass the value as a discrete
      ProcessBuilder argument instead of concatenating it into a command string,
      and drop the `sh -c` wrapper so no shell interprets it. If a single
      command string is unavoidable, validate the value against an allowlist
      pattern first -- Java has no `shlex.quote` equivalent.
    metadata:
      original-rule: python-command-injection
      ported-from: python
    pattern-sources:
      # Flask's request.args.get has three servlet-API counterparts, all returning
      # attacker-controlled strings.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $REQ).getParameter(...)
              - pattern: (HttpServletRequest $REQ).getHeader(...)
              - pattern: (HttpServletRequest $REQ).getQueryString()
      # Spring MVC binds the same data to a handler parameter, so the parameter
      # itself is the source. focus-metavariable narrows the source range from the
      # whole method to the bound name.
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., @RequestParam(...) String $P, ...) { ... }
              - pattern: $RET $M(..., @RequestParam String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      # Runtime.exec(String) is the closest analogue of os.system: even though it
      # does not spawn a shell, it splits the string on whitespace, so tainted
      # input picks the program and can append argv tokens. The exclusion keeps
      # exec(String[]) out -- an argv array is not tokenized, and is the safe form.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec(...)
              - pattern: (Runtime $RT).exec(...)
          - pattern-not: $ANY.exec(new String[]{...}, ...)
      # Explicit shell wrapping restores full os.system semantics -- `;`, `|` and
      # backticks are interpreted -- whether the argv is built as an array, as
      # ProcessBuilder varargs, as a list, or through ProcessBuilder.command().
      - pattern-either:
          - pattern: $ANY.exec(new String[]{$SH, "-c", ...}, ...)
          - pattern: new ProcessBuilder($SH, "-c", ...).start()
          - pattern: new ProcessBuilder(List.of($SH, "-c", ...)).start()
          - pattern: (ProcessBuilder $PB).command($SH, "-c", ...)
    pattern-sanitizers:
      # Allowlist validation is the Java stand-in for shlex.quote: no shell
      # metacharacter survives the regex. The guard cleans the variable itself,
      # so the sanitizer focuses on $X and applies by side effect from the check
      # onward rather than only to the boolean the check produces.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: (Pattern $PAT).matcher($X).matches()
              - pattern: $X.matches($RE)
          - focus-metavariable: $X
