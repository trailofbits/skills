rules:
  - id: python-command-injection-go
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Command injection vulnerability. User input flows into a command that is
      interpreted by a shell (`sh -c`, `bash -c`, `cmd /C`), or into the program
      name of a process launch, so request data is executed as code. Drop the
      shell and pass each argument as its own `exec.Command` argv element
      (`exec.Command("ls", "-l", "--", dir)`); os/exec does not involve a shell,
      so the value can never be reparsed as a command. When a shell is
      unavoidable, escape every interpolated value with
      `shellescape.Quote`, and resolve program names through an allow-list
      rather than from the request.
    metadata:
      original-rule: python-command-injection
      ported-from: python
      category: security
      subcategory:
        - vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')"
      technology:
        - go
        - net/http
        - gin
        - gorilla
        - chi
      references:
        - https://pkg.go.dev/os/exec#Command
        - https://pkg.go.dev/github.com/alessio/shellescape#Quote

    pattern-sources:
      # net/http. These accessor names are specific enough to match untyped,
      # which also covers handlers that reach the request through a wrapper.
      # url.Values is tainted as a whole so both `q := r.URL.Query()` followed
      # by `q.Get(...)` and the chained form are covered.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.URL.Path
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Form.Get(...)
      - pattern: $R.PostForm.Get(...)
      - pattern: $R.Header.Get(...)
      # gorilla/mux path variables. The whole map is the source, so indexing it
      # (mux.Vars(r)["tool"]) stays tainted.
      - pattern: mux.Vars(...)
      # go-chi path variables.
      - pattern: chi.URLParam(...)
      - pattern: chi.URLParamFromCtx(...)
      # gin. Query/Param/PostForm are common method names on unrelated types
      # (database/sql, for one), so these are matched by receiver type instead
      # of by name.
      - pattern: "($C : *gin.Context).Query(...)"
      - pattern: "($C : *gin.Context).DefaultQuery(...)"
      - pattern: "($C : *gin.Context).Param(...)"
      - pattern: "($C : *gin.Context).PostForm(...)"
      - pattern: "($C : *gin.Context).DefaultPostForm(...)"
      - pattern: "($C : *gin.Context).GetHeader(...)"

    pattern-sinks:
      # A shell wrapper turns its argument into code. This is the direct
      # equivalent of Python's os.system: the shell parses metacharacters.
      # Only the command string is a sink -- the argv-style call
      # exec.Command($BIN, $TAINTED) has no shell and is the recommended fix,
      # so it must not match here.
      - patterns:
          - pattern-either:
              - pattern: exec.Command($SHELL, $FLAG, $CMD, ...)
              - pattern: exec.CommandContext($CTX, $SHELL, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"?([\w/\\.:-]*[/\\])?(sh|bash|dash|zsh|ksh|ash|csh|tcsh|fish|cmd|cmd\.exe|powershell|powershell\.exe|pwsh|pwsh\.exe)"?$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"?(-c|-lc|-ic|--command|/c|/C|/k|/K|-Command|-command|-EncodedCommand)"?$
          - focus-metavariable: $CMD
      # A tainted program name is executed directly, without a shell. Narrower
      # than the case above -- only the first argument is a sink -- but the
      # request still chooses which binary runs.
      - patterns:
          - pattern-either:
              - pattern: exec.Command($CMD, ...)
              - pattern: exec.CommandContext($CTX, $CMD, ...)
          - focus-metavariable: $CMD
      # Lower-level launches. syscall.Exec replaces the current process and
      # os.StartProcess forks; both take the program path first.
      - patterns:
          - pattern-either:
              - pattern: syscall.Exec($CMD, ...)
              - pattern: syscall.ForkExec($CMD, ...)
              - pattern: os.StartProcess($CMD, ...)
          - focus-metavariable: $CMD

    pattern-sanitizers:
      # github.com/alessio/shellescape is the usual stand-in for shlex.quote;
      # the standard library has no shell-quoting function.
      - pattern: shellescape.Quote(...)
      - pattern: shellescape.QuoteCommand(...)
