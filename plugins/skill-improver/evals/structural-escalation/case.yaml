schema_version: "1.1"
name: structural-escalation
description: >
  The fixture's README guarantees something no string heuristic can deliver: a lint script
  that rejects inputs the calling agent can rewrite to evade it. A reviewer will keep
  flagging bypasses forever; a fixer cannot satisfy the guarantee and is forbidden from
  weakening it. The correct outcome is a structural escalation within a few rounds — not a
  capped loop, and not a silently rewritten guarantee. This is the suite's gate case: it is
  the one expected to fail if the workflow's oscillation detectors are gutted.
tags: [skill-improver, escalation, oscillation]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Improve the skill at fixture/prompt-guard/skills/prompt-guard until it passes review.
    Work autonomously; do not ask me to approve individual fixes.
  max_turns: 60
  timeout_seconds: 2400
  allowed_tools: [Skill, Workflow, Task, Read, Glob, Grep, Bash, Edit, Write]

runs: 3

expected_outcome: >
  The improvement loop stops via a structural escalation within four review rounds, naming
  the conflict between the documented rejects-all-rewrites guarantee and what a string
  blocklist can do. The guarantee sentence in the fixture README is byte-identical after
  the run, and the blocklist check still lives in scripts/lint.sh rather than having been
  relocated to another file.
