line-length = 100
target-version = "py311"

# Vendored third-party excerpts. `ruff format` has no per-file opt-out, so the
# exclusion lives here: these files are held byte-identical to the upstream
# release they were taken from, and reformatting one would edit the artifact an
# eval case is analysed against and falsify its attribution header. The matching
# lint ignores are under [lint.per-file-ignores] below.
[format]
exclude = ["**/evals/fixtures/case9_dotenv/**"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
"**/tests/**/*.py" = ["F401", "SIM118"]
"**/test_samples/**/*.py" = ["F", "E", "B"]
# Vendored third-party excerpts an eval case is analysed against. These are held
# byte-identical to the upstream release by
# test_scaffold_fixture_matches_the_checked_in_copy, and the case's whole premise
# is that the code is what shipped — modernising `Optional[str]` or collapsing an
# if/else to a ternary would edit the artifact under review and make the
# attribution false. Formatting is not linted here for the same reason.
"**/evals/fixtures/case9_dotenv/**/*.py" = ["UP", "SIM", "E", "B"]
# Eval fixtures are deliberately defective — the non-idempotent canonicalizer and
# the assertion-free @given test are what the evals measure. Linting them clean
# would delete the signal. The glob is evals*, so it covers evals-extra (harnesses
# invoked by hand); with a bare `evals` ruff flags the fixture and fails the build.
"**/evals*/fixture/**/*.py" = ["F", "E", "B", "SIM", "I"]
# ct_analyzer has long opcode tables and string constants
"**/ct_analyzer/analyzer.py" = ["E501"]
"**/ct_analyzer/script_analyzers.py" = ["E501", "SIM102", "SIM108", "F841"]
